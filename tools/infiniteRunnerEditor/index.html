<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Infinite Runner Chunk Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <h1>Runner Chunk Editor</h1>
            <p class="muted">Edit `world1_chunks.json` visually and export clean JSON back out.</p>

            <section class="panel">
                <h2>File</h2>
                <div class="button-row">
                    <button id="load-project-json">Load Project JSON</button>
                    <label class="file-button">
                        Import JSON
                        <input id="import-json" type="file" accept=".json,application/json">
                    </label>
                </div>
                <div class="button-row">
                    <button id="save-json">Download JSON</button>
                    <button id="copy-json">Copy JSON</button>
                </div>
                <p id="status-text" class="status">No file loaded yet.</p>
            </section>

            <section class="panel">
                <h2>Chunk</h2>
                <label>
                    <span>Filter</span>
                    <input id="chunk-filter" type="text" placeholder="SP1, rm_GameRoom, 640...">
                </label>
                <div id="chunk-list" class="chunk-list"></div>
            </section>

            <section class="panel">
                <h2>Palette</h2>
                <div id="palette" class="palette"></div>
            </section>
        </aside>

        <main class="workspace">
            <header class="workspace-toolbar">
                <div class="toolbar-group">
                    <label>
                        <span>Zoom</span>
                        <input id="zoom-range" type="range" min="0.4" max="2.5" step="0.1" value="1">
                    </label>
                    <span id="zoom-label">100%</span>
                </div>
                <div class="toolbar-group">
                    <button id="add-selected-type">Add Selected Type</button>
                    <button id="duplicate-selected">Duplicate Selected</button>
                    <button id="delete-selected" class="danger">Delete Selected</button>
                </div>
            </header>

            <section class="editor-grid">
                <div class="canvas-panel">
                    <div class="canvas-header">
                        <div>
                            <h2 id="chunk-title">No chunk selected</h2>
                            <p id="chunk-subtitle" class="muted"></p>
                        </div>
                        <div class="canvas-help">
                            Click to select. Drag to move. Shift-drag disables snapping. Delete removes.
                        </div>
                    </div>
                    <div id="canvas-scroll" class="canvas-scroll">
                        <canvas id="chunk-canvas" width="640" height="960"></canvas>
                    </div>
                </div>

                <div class="inspector-panel">
                    <section class="panel">
                        <h2>Chunk Properties</h2>
                        <label>
                            <span>Width</span>
                            <input id="chunk-width" type="number" step="16">
                        </label>
                        <label>
                            <span>Source Room</span>
                            <input id="chunk-source-room" type="text">
                        </label>
                        <label>
                            <span>Source Start</span>
                            <input id="chunk-source-start" type="number" step="16">
                        </label>
                        <label>
                            <span>Element Count</span>
                            <input id="chunk-element-count" type="text" readonly>
                        </label>
                    </section>

                    <section class="panel">
                        <h2>Selected Element</h2>
                        <label>
                            <span>Object</span>
                            <select id="element-object"></select>
                        </label>
                        <label>
                            <span>dx</span>
                            <input id="element-dx" type="number" step="1">
                        </label>
                        <label>
                            <span>dy</span>
                            <input id="element-dy" type="number" step="1">
                        </label>
                        <label>
                            <span>scale_x</span>
                            <input id="element-scale-x" type="number" step="0.1">
                        </label>
                        <label>
                            <span>scale_y</span>
                            <input id="element-scale-y" type="number" step="0.1">
                        </label>
                        <label>
                            <span>rotation</span>
                            <input id="element-rotation" type="number" step="0.1">
                        </label>
                    </section>

                    <section class="panel">
                        <h2>JSON Preview</h2>
                        <textarea id="json-preview" spellcheck="false" readonly></textarea>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
